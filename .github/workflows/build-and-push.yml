name: Build and Push Microservices to ECR

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: ap-south-2

jobs:
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Detect Changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          # On manual dispatch, force all services to match
          list-files: shell
          filters: |
            backend-api:
              - 'backend-api/**'
            frontend:
              - 'frontend/**'

  build-and-push:
    name: Build & Push
    needs: detect-changes
    # Run if any services changed OR if triggered manually
    if: ${{ needs.detect-changes.outputs.services != '[]' && needs.detect-changes.outputs.services != '' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    
    permissions:
      id-token: write
      contents: read

    strategy:
      fail-fast: false # If one service fails, let the others finish building
      matrix:
        service: ${{ github.event_name == 'workflow_dispatch' && fromJSON('["backend-api", "frontend"]') || fromJSON(needs.detect-changes.outputs.services) }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Debug OIDC Sub Claim
        run: |
          # Fetch the raw JWT token from GitHub's OIDC provider
          ACTIONS_ID_TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          # Decode the payload without needing secret keys
          echo "Your exact token payload:"
          echo "$ACTIONS_ID_TOKEN" | jq -R 'split(".") | .[1] | @base64d | fromjson'

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::526727148285:role/GithubActionsTerraformRole
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set Image Tag & Short SHA
        id: vars
        run: echo "COMMIT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Build and Push Docker Image
        env: 
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          SERVICE_NAME: ${{ matrix.service }}
          BUILD_CONTEXT: ./${{ matrix.service }}
          DOCKERFILE: ./${{ matrix.service }}/Dockerfile
        run: |
          echo "Building image for ${SERVICE_NAME}..."
          docker build -f ${DOCKERFILE} \
            -t ${ECR_REGISTRY}/${SERVICE_NAME}:${{ env.COMMIT_SHA }} \
            -t ${ECR_REGISTRY}/${SERVICE_NAME}:latest ${BUILD_CONTEXT}

          echo "Pushing ${SERVICE_NAME} to Amazon ECR..."
          docker push ${ECR_REGISTRY}/${SERVICE_NAME}:${{ env.COMMIT_SHA }}
          docker push ${ECR_REGISTRY}/${SERVICE_NAME}:latest

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3
        with: 
          kustomize-version: "5.3.0"

      - name: Update Image Tag in Repo (Gitops Manifests)
        env:
          GITOPS_PAT: ${{ secrets.GITOPS_REPO_PAT }}
          GITHUB_USER: "Shantanu-358"
          GITHUB_REPO: "gitops-manifests"
          SERVICE_NAME: ${{ matrix.service }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          # 1. Clone Repo 3
          git clone https://${GITHUB_USER}:${GITOPS_PAT}@github.com/${GITHUB_USER}/${GITOPS_REPO}.git gitops-dir
          cd gitops-dir

          # 2. Configure Git identity
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 3. Update image tag using kustomize in the service's directory
          cd apps/${SERVICE_NAME}
          kustomize edit set image ${ECR_REGISTRY}/${SERVICE_NAME}=${ECR_REGISTRY}/${SERVICE_NAME}:${{ env.COMMIT_SHA }}

          # 4. Check for changes, commit, and push back to Repo 3
          cd ../..
          git add apps/${SERVICE_NAME}/kustomization.yaml

          if ! git diff --staged --quiet; then
            git commit -m "chore(ci): update ${SERVICE_NAME} image tag to ${COMMIT_SHA}"
            git pull --rebase origin main
            git push origin main
            echo "Successfully updated ${SERVICE_NAME} image tag in Repo 3 to ${COMMIT_SHA}"
          else
            echo "No manifest changes to commit."
          fi