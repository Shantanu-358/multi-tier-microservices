name: Build and Push Microservices to ECR

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: ap-south-2

jobs:
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      backend-api: ${{ steps.filter.outputs.backend-api }}
      frontend: ${{ steps.filter.outputs.frontend }}
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Detect Changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters:
            backend-api:
              - 'backend-api/**'
            frontend:
              - 'frontend/**'

  build-and-push:
    name: Build & Push
    needs: detect-changes
    runs-on: ubuntu-latest
    
    permissions:
      id-token: write
      contents: read

    strategy:
      fail-fast: false # If one service fails, let the others finish building
      matrix:
        include:
          - name: backend-api
            path: ./backend-api
            dockerfile: ./backend-api/Dockerfile
            should_run: ${{ needs.detect-changes.outputs.backend-api }}
          - name: frontend
            path: ./frontend
            dockerfile: ./frontend/Dockerfile
            should_run: ${{ needs.detect-changes.outputs.frontend }}
    
    if: matrix.should_run == 'true' || github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::526727148285:role/GithubActionsTerraformRole
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set Image Tag & Short SHA
        id: vars
        run: echo "COMMIT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Build and Push Docker Image
        env: 
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          SERVICE_NAME: ${{ matrix.name }}
          BUILD_CONTEXT: ${{ matrix.path }}
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: |
          echo "Building image for ${SERVICE_NAME}..."
          docker build -f ${DOCKERFILE} \
            -t ${ECR_REGISTRY}/${SERVICE_NAME}:${{ env.COMMIT_SHA }} \
            -t ${ECR_REGISTRY}/${SERVICE_NAME}:latest ${BUILD_CONTEXT}

          echo "Pushing ${SERVICE_NAME} to Amazon ECR..."
          docker push ${ECR_REGISTRY}/${SERVICE_NAME}:${{ env.COMMIT_SHA }}
          docker push ${ECR_REGISTRY}/${SERVICE_NAME}:latest

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3
        with: 
          kustomize-version: "5.3.0"

      - name: Update Image Tag in Repo (Gitops Manifests)
        env:
          GITOPS_PAT: ${{ secrets.GITOPS_REPO_PAT }}
          GITHUB_USER: "Shantanu-358"
          GITHUB_REPO: "gitops-manifests"
          SERVICE_NAME: ${{ matrix.name }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          # 1. Clone Repo 3
          git clone https://${GITHUB_USER}:${GITOPS_PAT}@github.com/${GITHUB_USER}/${GITOPS_REPO}.git gitops-dir
          cd gitops-dir

          # 2. Configure Git identity
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 3. Update image tag using kustomize in the service's directory
          cd apps/${SERVICE_NAME}
          kustomize edit set image ${ECR_REGISTRY}/${SERVICE_NAME}=${ECR_REGISTRY}/${SERVICE_NAME}:${{ env.COMMIT_SHA }}

          # 4. Check for changes, commit, and push back to Repo 3
          cd ../..
          git add apps/${SERVICE_NAME}/kustomization.yaml

          if ! git diff --staged --quiet; then
            git commit -m "chore(ci): update ${SERVICE_NAME} image tag to ${COMMIT_SHA}"
            git pull --rebase origin main
            git push origin main
            echo "Successfully updated ${SERVICE_NAME} image tag in Repo 3 to ${COMMIT_SHA}"
          else
            echo "No manifest changes to commit."
          fi